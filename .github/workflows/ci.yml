name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck (app + agent)
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test
      - name: Dependency audit (production deps, high+)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
      - name: Migrations apply cleanly to a fresh local D1
        run: pnpm exec wrangler d1 migrations apply sythix-db --local
      - name: Cloudflare Workers build (OpenNext)
        run: pnpm cf:build
      - name: Bundle the Worker entry (dry run)
        run: pnpm exec wrangler deploy --dry-run --outdir .wrangler/dry-run
      - name: Build server agent
        run: pnpm agent:build
      - name: Secret scan of tracked files
        run: |
          if git grep -nE '(CLOUDFLARE_API_TOKEN|RESEND_API_KEY|MS_CLIENT_SECRET)\s*=\s*[A-Za-z0-9_\-]{12,}' -- ':!*.md' ':!.dev.vars.example'; then
            echo "Possible committed secret found"; exit 1; fi

  preview:
    name: Deployment preview
    needs: checks
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Upload preview version to staging Worker (no traffic shift)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm cf:build && pnpm exec opennextjs-cloudflare upload --env staging
      - name: Preview skipped
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN is not configured for the preview environment; skipping preview upload."
